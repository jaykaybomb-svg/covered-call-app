name: Daily Stock Price Updater (v2 Open / Noon / Close)

on:
  schedule:
    # 1) 국내 장 시초가(OPEN) 반영: 평일 09:10 KST (UTC 00:10)
    - cron: '10 0 * * 1-5'
    # 2) 국내 장 12시 정오가(NOON) 반영: 평일 12:05 KST (UTC 03:05)
    - cron: '5 3 * * 1-5'
    # 3) 국내 장 마감 종가(CLOSE) 반영: 평일 15:40 KST (UTC 06:40)
    - cron: '40 6 * * 1-5'
  workflow_dispatch: # 테스트용 수동 실행 버튼 활성화

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 시초가 · 12시 · 종가 수집 및 Supabase 전송 실행 (표준 라이브러리 사용)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python updater.py
