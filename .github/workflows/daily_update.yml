name: Daily Stock Closing Price Updater

on:
  schedule:
    # 1) 한국 장마감 반영: 평일 15:45 KST (UTC 06:45)
    - cron: '45 6 * * 1-5'
    # 2) 미국 장마감 반영: 평일 익일 06:10 KST (UTC 21:10)
    - cron: '10 21 * * 1-5'
  workflow_dispatch: # 테스트용 수동 실행 버튼 활성화

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install yfinance finance-datareader supabase pandas

      - name: 종가 수집 및 Supabase 전송 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python updater.py
